<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hangke - Code d'accès</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #1a1a2e; color: white; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .container { background: #16213e; padding: 40px; border-radius: 15px; width: 350px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h1 { margin-bottom: 25px; color: #e94560; font-size: 1.8em; }
        input { width: 100%; padding: 12px; margin: 8px 0; border: none; border-radius: 8px; background: #0f3460; color: white; font-size: 1em; }
        input::placeholder { color: #aaa; }
        button { width: 100%; padding: 12px; margin-top: 15px; border: none; border-radius: 8px; background: #e94560; color: white; font-size: 1em; cursor: pointer; }
        button:hover { background: #c73652; }
        #erreur { color: #ff6b6b; margin-top: 10px; font-size: 0.9em; }
        .hidden { display: none; }
        #code { font-size: 3em; font-weight: bold; color: #e94560; letter-spacing: 5px; margin: 20px 0; }
        #heure { color: #aaa; font-size: 0.9em; margin-bottom: 20px; }
        #bienvenue { color: #4ecca3; margin-bottom: 10px; font-size: 1.1em; }
        #timer { color: #aaa; font-size: 0.85em; margin-top: 10px; }
        #deconnexion { background: #444; margin-top: 20px; }
        #deconnexion:hover { background: #333; }
    </style>
</head>
<body>

    <!-- PAGE CONNEXION -->
    <div id="page-connexion" class="container">
        <h1>Hangke</h1>
        <input type="text" id="identifiant" placeholder="Identifiant (prenom.nom)" />
        <input type="password" id="motdepasse" placeholder="Mot de passe" />
        <button onclick="seConnecter()">Se connecter</button>
        <div id="erreur"></div>
    </div>

    <!-- PAGE CODE -->
    <div id="page-code" class="container hidden">
        <div id="bienvenue"></div>
        <h1>Code actif</h1>
        <div id="code">------</div>
        <div id="heure"></div>
        <div id="timer"></div>
        <button id="deconnexion" onclick="seDeconnecter()">Se déconnecter</button>
    </div>

    <script>
        const URL_SCRIPT = "https://script.google.com/macros/s/AKfycbwF1JJDNCi9kWhFdQfEoVYf8URVfBG4yi48hQDosazty8iXVN-kntZBs66rpWvuoAlVxA/exec";
        const DUREE_SESSION = 5 * 60 * 1000; // 5 minutes
        let intervalCode;
        let intervalTimer;
        let intervalSession;

        // Vérifier si déjà connecté
        window.onload = function() {
            const utilisateur = sessionStorage.getItem('utilisateur');
            const heureConnexion = sessionStorage.getItem('heureConnexion');
            if (utilisateur && heureConnexion && Date.now() - heureConnexion < DUREE_SESSION) {
                afficherPageCode(utilisateur);
            } else {
                sessionStorage.clear();
            }
        };

        async function seConnecter() {
            const identifiant = document.getElementById('identifiant').value.trim().toLowerCase();
            const motdepasse = document.getElementById('motdepasse').value;
            document.getElementById('erreur').textContent = '';

            if (!identifiant || !motdepasse) {
                document.getElementById('erreur').textContent = 'Veuillez remplir tous les champs.';
                return;
            }

            try {
                const response = await fetch(`${URL_SCRIPT}?identifiant=${encodeURIComponent(identifiant)}&password=${encodeURIComponent(motdepasse)}&action=connexion`);
                const data = await response.json();

                if (data.success) {
                    sessionStorage.setItem('utilisateur', identifiant);
                    sessionStorage.setItem('heureConnexion', Date.now());
                    afficherPageCode(identifiant);
                } else {
                    document.getElementById('erreur').textContent = 'Identifiant ou mot de passe incorrect.';
                }
            } catch (e) {
                document.getElementById('erreur').textContent = 'Erreur de connexion au serveur.';
            }
        }

        function afficherPageCode(identifiant) {
            document.getElementById('page-connexion').classList.add('hidden');
            document.getElementById('page-code').classList.remove('hidden');
            document.getElementById('bienvenue').textContent = `Bienvenue, ${identifiant} 👋`;

            mettreAJourCode();
            intervalCode = setInterval(mettreAJourCode, 30000);

            // Timer déconnexion
            intervalTimer = setInterval(mettreAJourTimer, 1000);

            // Vérification session expirée
            intervalSession = setInterval(function() {
                const heureConnexion = sessionStorage.getItem('heureConnexion');
                if (!heureConnexion || Date.now() - heureConnexion > DUREE_SESSION) {
                    alert("Session expirée, veuillez vous reconnecter.");
                    seDeconnecter();
                }
            }, 10000);
        }

        function mettreAJourTimer() {
            const heureConnexion = sessionStorage.getItem('heureConnexion');
            if (!heureConnexion) return;
            const restant = DUREE_SESSION - (Date.now() - heureConnexion);
            if (restant <= 0) return;
            const minutes = Math.floor(restant / 60000);
            const secondes = Math.floor((restant % 60000) / 1000);
            document.getElementById('timer').textContent =
                `⏱ Déconnexion dans ${minutes}:${secondes.toString().padStart(2, '0')}`;
        }

        function mettreAJourCode() {
            const now = new Date();
            const secondes = now.getSeconds();
            const minutes = now.getMinutes();
            const periode = Math.floor((minutes * 60 + secondes) / 30);
            const graine = now.toISOString().slice(0, 10).replace(/-/g, '') + periode;
            let hash = 0;
            for (let i = 0; i < graine.length; i++) {
                hash = ((hash << 5) - hash) + graine.charCodeAt(i);
                hash |= 0;
            }
            const code = Math.abs(hash) % 900000 + 100000;
            document.getElementById('code').textContent = code;
            document.getElementById('heure').textContent =
                `Mis à jour à ${now.toLocaleTimeString('fr-FR')}`;
        }

        function seDeconnecter() {
            clearInterval(intervalCode);
            clearInterval(intervalTimer);
            clearInterval(intervalSession);
            sessionStorage.clear();
            document.getElementById('page-connexion').classList.remove('hidden');
            document.getElementById('page-code').classList.add('hidden');
            document.getElementById('identifiant').value = '';
            document.getElementById('motdepasse').value = '';
            document.getElementById('erreur').textContent = '';
        }
    </script>
</body>
</html>
