<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code actif</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #1a1a2e;
            font-family: Arial, sans-serif;
        }

        .container {
            text-align: center;
            background-color: #16213e;
            padding: 40px 60px;
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(0, 150, 255, 0.3);
        }

        h1 {
            color: #ffffff;
            margin-bottom: 10px;
            font-size: 1.5rem;
        }

        #code {
            font-size: 4rem;
            font-weight: bold;
            color: #00d4ff;
            letter-spacing: 10px;
            margin: 20px 0;
        }

        #heure {
            color: #888;
            font-size: 0.9rem;
        }

        /* Connexion */
        #page-connexion input {
            display: block;
            width: 250px;
            margin: 10px auto;
            padding: 10px;
            border-radius: 8px;
            border: none;
            font-size: 1rem;
        }

        #page-connexion button {
            margin-top: 15px;
            padding: 10px 30px;
            background-color: #00d4ff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            font-weight: bold;
        }

        #page-connexion button:hover {
            background-color: #00aacc;
        }

        #erreur {
            color: #ff4444;
            margin-top: 10px;
            font-size: 0.9rem;
        }

        #btn-deconnexion {
            margin-top: 20px;
            padding: 8px 20px;
            background-color: #ff4444;
            border: none;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            font-size: 0.85rem;
        }

        #btn-deconnexion:hover {
            background-color: #cc0000;
        }

        #connecte-info {
            color: #888;
            font-size: 0.85rem;
            margin-top: 10px;
        }

        .hidden { display: none; }
    </style>
</head>
<body>

    <!-- Page de connexion -->
    <div class="container" id="page-connexion">
        <h1>Connexion</h1>
        <input type="text" id="identifiant" placeholder="Identifiant" />
        <input type="password" id="motdepasse" placeholder="Mot de passe" />
        <button onclick="seConnecter()">Se connecter</button>
        <div id="erreur"></div>
    </div>

    <!-- Page du code -->
    <div class="container hidden" id="page-code">
        <h1>Code actif</h1>
        <div id="code">------</div>
        <div id="heure"></div>
        <div id="connecte-info"></div>
        <button id="btn-deconnexion" onclick="seDeconnecter()">Se déconnecter</button>
    </div>

    <script>
        // Vérifie si déjà connecté
        const sessionUser = sessionStorage.getItem('utilisateur');
        if (sessionUser) {
            afficherCode(sessionUser);
        }

        async function seConnecter() {
            const identifiant = document.getElementById('identifiant').value.trim();
            const password = document.getElementById('motdepasse').value;

            if (!identifiant || !password) {
                document.getElementById('erreur').textContent = 'Veuillez remplir tous les champs.';
                return;
            }

            try {
                const reponse = await fetch('/api/auth', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ identifiant, password })
                });

                const data = await reponse.json();

                if (data.success) {
                    sessionStorage.setItem('utilisateur', identifiant);
                    afficherCode(identifiant);
                } else {
                    document.getElementById('erreur').textContent = 'Identifiant ou mot de passe incorrect.';
                }
            } catch (e) {
                document.getElementById('erreur').textContent = 'Erreur de connexion au serveur.';
            }
        }

        function afficherCode(utilisateur) {
            document.getElementById('page-connexion').classList.add('hidden');
            document.getElementById('page-code').classList.remove('hidden');
            document.getElementById('connecte-info').textContent = 'Connecté en tant que : ' + utilisateur;
            genererCode();
            setInterval(genererCode, 60000);
        }

        function seDeconnecter() {
            sessionStorage.removeItem('utilisateur');
            document.getElementById('page-connexion').classList.remove('hidden');
            document.getElementById('page-code').classList.add('hidden');
            document.getElementById('identifiant').value = '';
            document.getElementById('motdepasse').value = '';
            document.getElementById('erreur').textContent = '';
        }

        function genererCode() {
            var now = new Date();
            var year = now.getFullYear() % 100;
            var month = now.getMonth() + 1;
            var day = now.getDate();
            var hour = now.getHours();
            var total = (year * month * 100 + month * day + day * hour * 1001 + hour * year) * 17 ^ 677;
            var code = String(total).slice(-6).padStart(6, '0');
            document.getElementById('code').textContent = code;
            document.getElementById('heure').textContent =
                'Généré le ' + now.toLocaleDateString('fr-FR') +
                ' à ' + now.toLocaleTimeString('fr-FR');
        }

        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') seConnecter();
        });
    </script>

</body>
</html>
